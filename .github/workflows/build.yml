name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows-vst3.yml
    with:
      arch: x64
      run-pluginval: true

  build-linux-x64:
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: x64

  build-linux-arm64:
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: arm64

  build-macos-arm64:
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: arm64
      run-pluginval: true

  build-macos-x64:
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: x64
      run-pluginval: true

  # Deviation from the shared pattern: runs the ctest suite (previously part of the old build jobs).
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-x64-vst3-release
          - os: ubuntu-latest
            preset: linux-x64-vst3-release
          - os: macos-latest
            preset: macos-arm64-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: ${{ runner.os == 'Linux' }}
        run: sudo bash scripts/install-linux-deps.sh

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Run unit tests
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure
