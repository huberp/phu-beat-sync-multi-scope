on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3). Created on the selected branch/commit if it does not exist yet.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the release tag; for manual runs create it if missing
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve (and create) tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if ! [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo "ERROR: tag '$TAG' must look like v1.2.3 (or v1.2.3-rc1)"
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if EXISTING=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
              if [ "$EXISTING" != "$GITHUB_SHA" ]; then
                echo "ERROR: tag $TAG already exists at $EXISTING, but this run is on $GITHUB_SHA."
                echo "Run the workflow with the tag itself selected under 'Use workflow from'."
                exit 1
              fi
              echo "Tag $TAG already exists at $GITHUB_SHA"
            else
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
              echo "Created tag $TAG at $GITHUB_SHA"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build & package Windows x64 VST3
  # ---------------------------------------------------------------------------
  release-windows-x64:
    name: Windows x64 VST3
    needs: prepare
    uses: ./.github/workflows/build-windows-vst3.yml
    with:
      arch: x64
      run-pluginval: true
      upload-artifact: true
      artifact-name: windows-x64-vst3
      ref-name: ${{ needs.prepare.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Build & package Windows ARM64 VST3 (cross-compiled on x64 runner)
  # ---------------------------------------------------------------------------
  release-windows-arm64:
    name: Windows ARM64 VST3
    needs: prepare
    uses: ./.github/workflows/build-windows-vst3.yml
    with:
      arch: ARM64
      run-pluginval: false
      upload-artifact: true
      artifact-name: windows-arm64-vst3
      ref-name: ${{ needs.prepare.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Build & package Linux VST3
  # ---------------------------------------------------------------------------
  release-linux-x64:
    name: Linux x64 VST3
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: x64
      run-pluginval: true
      upload-artifact: true
      artifact-name: linux-x64-vst3
      ref-name: ${{ needs.prepare.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Build & package macOS VST3 + AU (Apple Silicon)
  # ---------------------------------------------------------------------------
  release-macos-arm64:
    name: macOS arm64 VST3/AU
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: arm64
      run-pluginval: true
      upload-artifact: true
      artifact-name: macos-arm64-plugin
      ref-name: ${{ needs.prepare.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Build & package macOS VST3 + AU (Intel)
  # ---------------------------------------------------------------------------
  release-macos-x64:
    name: macOS x64 VST3/AU
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: x64
      run-pluginval: true
      upload-artifact: true
      artifact-name: macos-x64-plugin
      ref-name: ${{ needs.prepare.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Generate README.pdf
  # ---------------------------------------------------------------------------
  generate-pdf:
    name: Generate README.pdf
    uses: ./.github/workflows/generate-pdf.yml
    with:
      in-md: README.md

  # ---------------------------------------------------------------------------
  # Inject README.pdf into all zips, publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [prepare, release-windows-x64, release-windows-arm64, release-linux-x64, release-macos-arm64, release-macos-x64, generate-pdf]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-vst3
          path: dist/

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-arm64-vst3
          path: dist/

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-vst3
          path: dist/

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-plugin
          path: dist/

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-x64-plugin
          path: dist/

      - name: Download README.pdf artifact
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: .

      - name: Inject README.pdf into all release zips
        run: |
          for zip in dist/*.zip; do
            zip -j "$zip" README.pdf
            echo "Injected README.pdf into $zip"
          done

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: phu-beat-sync-multi-scope ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          body: |
            ## phu-beat-sync-multi-scope ${{ needs.prepare.outputs.tag }}

            ### Installation

            **Windows x64** — download `PHU-BEAT-SYNC-MULTI-SCOPE-windows-x64-*.zip`, extract and copy
            `PHU BEAT SYNC MULTI SCOPE.vst3` to `C:\Program Files\Common Files\VST3\`.

            **Windows ARM64** — download `PHU-BEAT-SYNC-MULTI-SCOPE-windows-arm64-*.zip`, extract and copy
            `PHU BEAT SYNC MULTI SCOPE.vst3` to `C:\Program Files\Common Files\VST3\`.

            **Linux x64** — download `PHU-BEAT-SYNC-MULTI-SCOPE-linux-x64-*.zip`, extract and copy
            `PHU BEAT SYNC MULTI SCOPE.vst3` to `~/.vst3/`.

            **macOS (Apple Silicon)** — download `PHU-BEAT-SYNC-MULTI-SCOPE-macos-arm64-*.zip`, extract and copy
            `PHU BEAT SYNC MULTI SCOPE.vst3` to `~/Library/Audio/Plug-Ins/VST3/` and
            `PHU BEAT SYNC MULTI SCOPE.component` to `~/Library/Audio/Plug-Ins/Components/`.

            **macOS (Intel)** — download `PHU-BEAT-SYNC-MULTI-SCOPE-macos-x64-*.zip` and install as above.

            > The macOS builds are not code-signed or notarized. If Gatekeeper blocks the plugin, run
            > `xattr -dr com.apple.quarantine "<plugin bundle>"` on the extracted bundle.

            Each zip contains the plugin bundle(s) and a `README.pdf` with full documentation.

            ### Prerequisite (Windows)

            Requires the [Visual C++ 2015–2022 Redistributable (x64)](https://aka.ms/vs/17/release/vc_redist.x64.exe).

            ### What's Changed

            See [CHANGELOG](https://github.com/huberp/phu-beat-sync-multi-scope/commits/${{ needs.prepare.outputs.tag }})
            or compare against the previous tag.
          files: dist/*.zip